# Playwright API + E2E tests for QA Turgus.
#
# CI/CD variables (Settings → CI/CD → Variables), all optional:
#   BASE_URL   storefront under test   (default: public GitHub Pages instance)
#   API_URL    REST API incl. /api/    (default: public Cloudflare Workers instance)
#   TEST_GREP  run a subset, e.g. "@smoke" (empty = everything)
#
# Nightly full run: Build → Pipeline schedules → New schedule on the default branch.

stages:
  - lint
  - test
  - report

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  # Keep the tag in sync with @playwright/test in package-lock.json — the image ships matching browsers.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

variables:
  TEST_GREP: ''

lint:
  stage: lint
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check

.playwright-tests:
  stage: test
  needs: [lint]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - blob-report/
      - junit-results/
      - test-results/
    reports:
      junit: junit-results/results.xml

api-tests:
  extends: .playwright-tests
  variables:
    PLAYWRIGHT_BLOB_OUTPUT_NAME: report-api.zip
  script:
    - npx playwright test --project=api ${TEST_GREP:+--grep "$TEST_GREP"}

e2e-tests:
  extends: .playwright-tests
  parallel: 2
  variables:
    PLAYWRIGHT_BLOB_OUTPUT_NAME: report-e2e-${CI_NODE_INDEX}.zip
  script:
    - npx playwright test --project=e2e-chromium --shard=${CI_NODE_INDEX}/${CI_NODE_TOTAL} ${TEST_GREP:+--grep "$TEST_GREP"}

merge-reports:
  stage: report
  needs:
    - job: api-tests
      artifacts: true
    - job: e2e-tests
      artifacts: true
  when: always
  script:
    - npx playwright merge-reports --reporter html ./blob-report
  artifacts:
    when: always
    expire_in: 2 weeks
    expose_as: Playwright report
    paths:
      - playwright-report/
